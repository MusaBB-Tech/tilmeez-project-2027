name: tilmeez_project_2027
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  iconsax_flutter: ^1.0.0
  get: ^4.7.2
  intl: ^0.20.2
  supabase_flutter: ^2.9.0

  carousel_slider: ^5.1.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  loading_animation_widget: ^1.3.0
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  cached_network_image: ^3.4.1
  animated_text_kit: ^4.2.3
  webview_flutter: ^4.13.0
  fluttertoast: ^8.2.12
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ------------------------------------------------------------------
# App icon generator (Android + iOS)
# Run:  dart run flutter_launcher_icons
# ------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tilmeez_logo.png"
  remove_alpha_ios: true                       # required for App Store
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/tilmeez_logo.png"
  min_sdk_android: 21

# ------------------------------------------------------------------
# Splash / loading screen (optional)
# Run:  dart run flutter_native_splash:create
# ------------------------------------------------------------------
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/tilmeez_logo.png
  color_dark: "#000000"
  image_dark: assets/images/tilmeez_logo.png
  web: true

# ------------------------------------------------------------------
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/